<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" fill="white"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 25px; }
    .axis { stroke: #111827; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .guide { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 10 9; }
    .c1 { stroke: #2563eb; stroke-width: 6; fill: none; }
    .c2 { stroke: #7c3aed; stroke-width: 6; fill: none; }
    .c3 { stroke: #dc2626; stroke-width: 6; fill: none; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
  <text x="350" y="48" text-anchor="middle" class="title">Output characteristics</text>
  <line x1="95" y1="520" x2="645" y2="520" class="axis"/>
  <line x1="95" y1="520" x2="95" y2="90" class="axis"/>
  <text x="625" y="565" class="label">V<tspan baseline-shift="sub" font-size="18">DS</tspan></text>
  <text x="35" y="115" class="label">I<tspan baseline-shift="sub" font-size="18">DS</tspan></text>
  <path d="M95 520 C190 420, 280 385, 390 380 C480 378, 555 378, 625 378" class="c1"/>
  <path d="M95 520 C190 340, 285 280, 410 270 C500 268, 565 268, 625 268" class="c2"/>
  <path d="M95 520 C190 265, 300 170, 445 145 C520 142, 580 142, 625 142" class="c3"/>
  <line x1="365" y1="520" x2="365" y2="105" class="guide"/>
  <text x="180" y="610" class="label">linear</text>
  <text x="430" y="610" class="label">pinch-off / saturation</text>
  <text x="520" y="125" class="label">higher |V<tspan baseline-shift="sub" font-size="18">G</tspan>−V<tspan baseline-shift="sub" font-size="18">T</tspan>|</text>

  <text x="1050" y="48" text-anchor="middle" class="title">Transfer characteristics</text>
  <line x1="790" y1="520" x2="1340" y2="520" class="axis"/>
  <line x1="790" y1="520" x2="790" y2="90" class="axis"/>
  <text x="1315" y="565" class="label">V<tspan baseline-shift="sub" font-size="18">G</tspan></text>
  <text x="715" y="115" class="label">I<tspan baseline-shift="sub" font-size="18">DS</tspan></text>
  <path d="M790 520 L930 520 C1010 515, 1090 480, 1150 400 C1215 310, 1270 200, 1325 105" class="c3"/>
  <line x1="930" y1="520" x2="930" y2="100" class="guide"/>
  <text x="910" y="565" class="label">V<tspan baseline-shift="sub" font-size="18">T</tspan></text>
  <text x="1025" y="475" class="label">I<tspan baseline-shift="sub" font-size="18">D,sat</tspan> ∝ (V<tspan baseline-shift="sub" font-size="18">G</tspan>−V<tspan baseline-shift="sub" font-size="18">T</tspan>)²</text>
</svg>
