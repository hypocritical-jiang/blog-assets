<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">色散关系中的相速度与群速度</title>
  <desc id="desc">在角频率对相位常数曲线上，相速度等于原点到工作点割线的斜率，群速度等于工作点切线的斜率。</desc>
  <rect width="1200" height="700" rx="28" fill="#f8fafc"/>
  <style>
    .axis{stroke:#334155;stroke-width:4;stroke-linecap:round}.guide{stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 9}
    .curve{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round}.secant{stroke:#7c3aed;stroke-width:5;stroke-dasharray:13 9}.tangent{stroke:#dc2626;stroke-width:6}
    .label{font:30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
  </style>
  <text x="600" y="55" text-anchor="middle" class="label" font-weight="700">Dispersion relation: phase velocity and group velocity</text>
  <line x1="120" y1="600" x2="1110" y2="600" class="axis"/><line x1="155" y1="625" x2="155" y2="105" class="axis"/>
  <path d="M1090 585l22 15-22 15M140 125l15-22 15 22" fill="none" class="axis"/>
  <path d="M155 600 C290 416 430 291 570 232 C710 174 865 157 1050 146" class="curve"/>
  <line x1="155" y1="600" x2="690" y2="187" class="secant"/>
  <line x1="470" y1="270" x2="940" y2="124" class="tangent"/>
  <line x1="690" y1="600" x2="690" y2="187" class="guide"/><line x1="155" y1="187" x2="690" y2="187" class="guide"/>
  <circle cx="690" cy="187" r="11" fill="#0f172a"/>
  <text x="1125" y="610" class="label">β</text><text x="115" y="95" class="label">ω</text>
  <text x="675" y="642" class="label">β₀</text><text x="105" y="198" class="label">ω₀</text>
  <text x="290" y="490" class="label" fill="#7c3aed">v<tspan baseline-shift="sub" font-size="20">p</tspan> = ω₀/β₀</text>
  <text x="765" y="105" class="label" fill="#dc2626">v<tspan baseline-shift="sub" font-size="20">g</tspan> = (dω/dβ)<tspan baseline-shift="sub" font-size="20">β₀</tspan></text>
  <text x="245" y="665" class="small">secant slope = phase velocity</text>
  <text x="735" y="665" class="small">tangent slope = group velocity</text>
</svg>
