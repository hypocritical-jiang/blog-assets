<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">两块四分之一波长介质板及空气间隙</title>
  <desc id="desc">两块折射率 n、厚度为介质内四分之一波长的介质板，中间隔着真空四分之一波长空气层，两侧均为空气。</desc>
  <defs><pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="18" stroke="#60a5fa" stroke-width="8"/></pattern></defs>
  <rect width="1200" height="560" rx="28" fill="#f8fafc"/>
  <style>.label{font:30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.edge{stroke:#1e3a8a;stroke-width:5}.dim{stroke:#475569;stroke-width:3;marker-start:url(#a);marker-end:url(#a)}</style>
  <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 0L0 4l8 4z" fill="#475569"/></marker>
  <text x="600" y="55" text-anchor="middle" class="label" font-weight="700">Problem Sheet 2 Q4: dielectric slab - air gap - dielectric slab</text>
  <line x1="80" y1="285" x2="1120" y2="285" stroke="#334155" stroke-width="4"/><path d="M1100 270l22 15-22 15" fill="none" stroke="#334155" stroke-width="4"/>
  <rect x="245" y="115" width="190" height="340" fill="url(#hatch)" class="edge"/><rect x="765" y="115" width="190" height="340" fill="url(#hatch)" class="edge"/>
  <text x="150" y="170" text-anchor="middle" class="label">air</text><text x="340" y="170" text-anchor="middle" class="label">n</text><text x="600" y="170" text-anchor="middle" class="label">air</text><text x="860" y="170" text-anchor="middle" class="label">n</text><text x="1050" y="170" text-anchor="middle" class="label">air</text>
  <line x1="255" y1="495" x2="425" y2="495" class="dim"/><line x1="445" y1="495" x2="755" y2="495" class="dim"/><line x1="775" y1="495" x2="945" y2="495" class="dim"/>
  <text x="340" y="535" text-anchor="middle" class="small">λd/4 = λ₀/(4n)</text><text x="600" y="535" text-anchor="middle" class="small">λ₀/4</text><text x="860" y="535" text-anchor="middle" class="small">λd/4 = λ₀/(4n)</text>
